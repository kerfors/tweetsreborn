<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@kerfors — Search</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700&family=Newsreader:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="breadcrumb" style="margin-bottom:20px;">
        <a href="index.html">← Archive</a>
    </div>
    <h2 style="font-family:var(--font-display);font-size:22px;font-weight:500;margin-bottom:20px;text-align:center;">Search tweets</h2>
    <div class="search-box">
        <input type="search" id="q" placeholder="Search 10 tweets…" autofocus>
        <button onclick="doSearch()">Search</button>
    </div>
    <div id="search-status"></div>
    <div id="results"></div>
</div>
<footer class="site-footer">
    Archived tweets from @kerfors · Powered by <a href="https://github.com/kerfors/tweetsreborn">TweetsReborn</a>
</footer>
<script>
let data = null;

async function loadData() {
    if (data) return data;
    const r = await fetch('search.json');
    data = await r.json();
    return data;
}

function highlight(text, query) {
    if (!query) return text;
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return text.replace(new RegExp(escaped, 'gi'), m => '<mark>' + m + '</mark>');
}

async function doSearch() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const status = document.getElementById('search-status');
    const results = document.getElementById('results');

    if (q.length < 2) {
        status.textContent = 'Type at least 2 characters.';
        results.innerHTML = '';
        return;
    }

    const tweets = await loadData();
    const matches = tweets.filter(t => t.text.toLowerCase().includes(q));

    status.textContent = matches.length === 0
        ? 'No results.'
        : matches.length + ' result' + (matches.length !== 1 ? 's' : '');

    results.innerHTML = matches.map(t => `
        <div class="search-result">
            <a href="${t.url}">
                <div class="result-text">${highlight(t.text, document.getElementById('q').value.trim())}</div>
                <div class="result-date">${t.date}</div>
            </a>
        </div>`).join('');
}

document.getElementById('q').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
